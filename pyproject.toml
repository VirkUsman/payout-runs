[project]
name = "payout-runs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "celery[redis]>=5.5",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.11", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--reuse-db -q"

[tool.ruff]
line-length = 100
extend-exclude = ["payouts/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
