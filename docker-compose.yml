x-app: &app
  build: .
  environment:
    POSTGRES_HOST: db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    CELERY_BROKER_URL: redis://redis:6379/0
    BANK_URL: ${BANK_URL:-http://host.docker.internal:9100}
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-this-is-only-for-local-compose}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: celery -A config worker --concurrency=4 --loglevel=INFO
  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payout_runs
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
